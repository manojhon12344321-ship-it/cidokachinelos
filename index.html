<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial}
/* FUNDO NO SITE INTEIRO - BANNER QUE TE ENVIEI */
body{

}
body::before{
  content:'';

  inset:0;

}
header{background:#111;color:#fff;padding:12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;user-select:none}
header img{height:42px;border-radius:8px;background:#fff;padding:2px}
.bannerTop{width:100%;height:210px;object-fit:cover;display:block;box-shadow:0 6px 20px rgba(255,100,150,.18)}
.lojaTop{background:rgba(255,255,255,0.92);padding:10px;position:sticky;top:66px;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.05);backdrop-filter:blur(10px);border-radius:0 0 16px 16px;margin:0 10px}
.searchRow{display:flex;gap:8px}
.searchRow input{flex:1;padding:12px 14px;border-radius:20px;border:1px solid #f0c2d0;background:#fff6f8;outline:none}

.btnAdd:disabled{background:#ddd;color:#888}

.qtyBtn{width:28px;height:28px;border-radius:50%;border:1px solid #ff8fab;background:#fff;font-weight:800;cursor:pointer}
.qtyNum{font-weight:800;min-width:20px;text-align:center}
.btnRemove{color:#ff3b3b;font-size:12px;font-weight:800;background:none;border:0;cursor:pointer}
.input{width:100%;padding:12px;border:1px solid #f0c2d0;border-radius:12px;margin:5px 0;background:#fff;outline:none}
.modoBox{display:flex;gap:8px;margin:10px 0}
.modoBtn{flex:1;padding:12px;border-radius:12px;border:2px solid #f0c2d0;background:#fff;font-weight:800;cursor:pointer;text-align:center}
.modoBtn.on{background:#111;color:#fff;border-color:#111}
.btnzap{width:100%;background:#25D366;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:800;margin-top:10px;font-size:16px;cursor:pointer}
.totalBox{background:#111;color:#fff;padding:14px;border-radius:12px;margin:10px 0;text-align:center;font-weight:800;font-size:16px}
#adminArea{background: url('./banner_fundo.jpg') no-repeat center center fixed;background-size:cover;min-height:100vh;padding:0;display:none;position:relative}
#adminArea::before{content:'';position:fixed;inset:0;background:rgba(255,246,248,0.92);z-index:0}
#adminArea > *{position:relative;z-index:1}
.adminHeader{background:linear-gradient(135deg,#ff8fab,#ffb3c6);padding:16px;color:#fff}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.dashCard{background:rgba(255,255,255,0.97);border-radius:16px;padding:12px;box-shadow:0 6px 18px rgba(255,100,150,.12);text-align:center}
.dashCard b{font-size:18px;display:block}
.tabs{display:flex;gap:8px;padding:10px;overflow:auto;position:sticky;top:0;background:rgba(255,246,248,0.9);z-index:5;backdrop-filter:blur(10px)}
.tab{border:0;padding:10px 16px;border-radius:20px;font-weight:800;white-space:nowrap;cursor:pointer}
.tab.on{background:#111;color:#fff}.tab.off{background:#fff;color:#111;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.adminList{padding:10px}
.editCard{background:rgba(255,255,255,0.98);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.05);border:2px solid transparent}
.editCard.editando{border-color:#ff8fab;background:#fff0f5}
.btn{border:0;padding:10px 14px;border-radius:10px;font-weight:700;margin:3px;cursor:pointer}
.btn-ok{background:#25D366;color:#fff}.btn-del{background:#ffe0e0;color:#a00;border:1px solid #ff8fab}.btn-edit{background:#111;color:#fff}.btn-galeria{background:linear-gradient(135deg,#ff8fab,#ffb3c6);color:#fff;width:100%;padding:14px;border-radius:12px;cursor:pointer;font-weight:800}
.btn-encomenda{background:#111;color:#fff;width:100%;padding:14px;border-radius:12px;font-weight:800;margin-top:8px;cursor:pointer}
#lock{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999}
#lock.show{display:flex}.lockBox{background:#fff;padding:20px;border-radius:16px;width:90%;max-width:320px;text-align:center}
.previewImg{width:100%;max-height:200px;object-fit:contain;border-radius:12px;display:none;margin:8px 0;border:2px dashed #ff8fab}
.alertIA{background:#ffefcc;border-left:4px solid #ff8fab;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:12px}
</style>
</head>
<body>
<header id="logoHeader"><img src="./logo.png" onerror="this.style.display='none'"><div><h1 style="font-size:20px">CIDOKA CHINELOS</h1></div></header>
<img class="bannerTop" src="./banner_fundo.jpg" onerror="this.src='./banner_feminino.jpg'">
<div id="lock"><div class="lockBox"><h3>🔒 Admin CIDOKA</h3><p style="font-size:11px;color:#888">Digite cida304050</p><input id="x1" type="password" placeholder="cida304050" style="width:100%;padding:14px;border:2px solid #111;border-radius:10px;margin:12px 0;text-align:center"><button class="btn btn-edit" style="width:100%;padding:12px" onclick="check()">Entrar</button><button class="btn" style="width:100%;background:#eee;margin-top:6px" onclick="document.getElementById('lock').classList.remove('show')">Cancelar</button></div></div>

<div id="loja">
<div class="lojaTop"><div class="searchRow"><input id="buscaLoja" placeholder="🔍 Buscar código A1..." oninput="loadLoja()"><button class="btn-cart" onclick="abrirCarrinho()">🛒 <span id="cartCount">0</span></button></div><div class="cats"><button class="cat on" id="cat-todos" onclick="setCat('todos')">Todos</button><button class="cat off" id="cat-chinelo" onclick="setCat('chinelo')">🩴 Chinelos</button><button class="cat off" id="cat-sabonete" onclick="setCat('sabonete')">🧼 Sabonetes</button></div></div>
<div id="produtos" class="grid">Carregando produtos...</div>
<div style="text-align:center;padding:12px;color:#111;font-size:12px;background:rgba(255,255,255,0.9);margin:10px;border-radius:16px;font-weight:700">🌸 CIDOKA Chinelos - Teixeira de Freitas - 73 9961-3272 🌸</div>
</div>

<div id="adminArea">
<div class="adminHeader"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>🌸 ADMIN CIDOKA</h2><p style="font-size:11px">5 toques - senha cida304050</p></div><button onclick="sairAdmin()" style="background:#fff;color:#ff8fab;border:0;padding:10px 18px;border-radius:20px;font-weight:800;cursor:pointer">⬅️ Modo Clientes</button></div></div>
<div class="dash" id="dash"></div>
<div class="tabs">
<button id="t-pedidos" class="tab off" onclick="setAba('pedidos')">📦 Pedidos</button>
<button id="t-clientes" class="tab on" onclick="setAba('clientes')">👥 Clientes</button>
<button id="t-encomendas" class="tab off" onclick="setAba('encomendas')">📝 Encomendas</button>
<button id="t-produtos" class="tab off" onclick="setAba('produtos')">🩴 Catálogo</button>
<button id="t-abandonados" class="tab off" onclick="setAba('abandonados')">🤖 Abandon.</button>
<button id="t-ia" class="tab off" onclick="setAba('ia')">🧠 IA</button>
<button class="tab off" onclick="sairAdmin()" style="background:#25D366;color:#fff">⬅️ Voltar Loja</button>
</div>
<div style="padding:0 10px"><input id="busca" class="input" placeholder="🔍 Buscar no admin..." oninput="loadAdmin()"></div>
<div id="formAdd" style="background:#fff;margin:10px;border-radius:16px;padding:12px"></div>
<div class="adminList" id="adminList"></div>
</div>

<div id="cart" onclick="if(event.target.id==='cart')fecharCarrinho()"><div id="cartBox">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>🛒 Seu Pedido</h3><span style="font-size:26px;cursor:pointer" onclick="fecharCarrinho()">✕</span></div>
<div id="cartItems"></div>
<div class="totalBox" id="total">Total: R$ 0,00</div>
<div class="modoBox">
<button id="btnEntrega" class="modoBtn on" onclick="setModo('ENTREGA')">🏠 Entrega</button>
<button id="btnRetirada" class="modoBtn" onclick="setModo('RETIRADA')">📦 Retirada</button>
</div>
<input id="nome" class="input" placeholder="👤 Seu nome *">
<input id="whats" class="input" placeholder="📱 WhatsApp *">
<div id="camposEndereco">
<input id="rua" class="input" placeholder="🛣️ Rua: Rua Abílio Alves Fernandes *">
<div style="display:flex;gap:8px"><input id="bairro" class="input" placeholder="🏘️ Bairro *"><input id="numero" class="input" placeholder="🔢 Nº *" style="max-width:100px"></div>
<input id="referencia" class="input" placeholder="📍 Ponto de referência (próx. ao mercado...)">
</div>
<div id="avisoRetirada" style="display:none;background:#fff0f5;padding:10px;border-radius:10px;text-align:center;border:2px dashed #ff8fab;margin:6px 0">📦 <b>Pronto a Retirada na loja</b><br>Teixeira de Freitas - avise no Zap 😍</div>
<select id="pagamento" class="input"><option>💳 Pix</option><option>💵 Dinheiro</option><option>💳 Cartão na entrega</option></select>
<button class="btnzap" onclick="finalizar()">FINALIZAR NO WHATSAPP ✅</button>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCxqFhzvj4jOht8jyqOsUGNOjEoAQmkT4U", authDomain: "cidoka-chinelos.firebaseapp.com", projectId: "cidoka-chinelos", storageBucket: "cidoka-chinelos.firebasestorage.app", messagingSenderId: "782363243367", appId: "1:782363243367:web:e61a041e6e54608abb75c2" };
const MEU_ZAP="557399613272";
const _k=atob("Y2lkYTMwNDA1MA=="); // cida304050 escondido
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
let aba='clientes',cat='todos',clicks=0,timer=null,imagemBase64="",galeriaEdit={},todos={pedidos:[],clientes:[],produtos:[],abandonados:[],encomendas:[]},modoEntrega='ENTREGA';
const fallback=[
  {codigo:"A1",nome:"Chinelo Floral Rosa A1",preco:59.90,imagem:"./chinelo_A1.jpg",estoque:12},
  {codigo:"A2",nome:"Chinelo Preto Básico A2",preco:49.90,imagem:"./chinelo_A1.jpg",estoque:20},
  {codigo:"C1",nome:"Sabonete Artesanal C1",preco:15.00,imagem:"./sabonete_C1.jpg",estoque:50},
  {codigo:"C2",nome:"Kit 3 Sabonetes C2",preco:35.00,imagem:"./sabonete_C1.jpg",estoque:8}
];
let produtos=[...fallback],carrinho=[];

document.getElementById("logoHeader").addEventListener("click",()=>{
  clicks++;clearTimeout(timer);timer=setTimeout(()=>clicks=0,3000);
  if(clicks>=5){
    clicks=0;
    if(localStorage.getItem("_a")==="1"){
      document.getElementById("loja").style.display="none";
      document.getElementById("adminArea").style.display="block";
      setAba('clientes');loadAdmin();
    }else{
      document.getElementById('lock').classList.add('show');
      document.getElementById('x1').focus();
    }
  }
});
window.setAba=(n)=>{aba=n;document.querySelectorAll('#adminArea .tabs .tab').forEach(t=>{if(!t.innerText.includes('Voltar')&&!t.innerText.includes('Modo'))t.className='tab off'});const el=document.getElementById('t-'+n);if(el)el.className='tab on';loadAdmin();};
window.setCat=(c)=>{cat=c;document.querySelectorAll('.cat').forEach(x=>x.className='cat off');document.getElementById('cat-'+c).className='cat on';loadLoja();};
window.sairAdmin=()=>{document.getElementById("adminArea").style.display="none";document.getElementById("loja").style.display="block";window.scrollTo(0,0);loadLoja();};
window.setModo=(m)=>{
  modoEntrega=m;
  document.getElementById('btnEntrega').className=m==='ENTREGA'?'modoBtn on':'modoBtn';
  document.getElementById('btnRetirada').className=m==='RETIRADA'?'modoBtn on':'modoBtn';
  document.getElementById('camposEndereco').style.display=m==='ENTREGA'?'block':'none';
  document.getElementById('avisoRetirada').style.display=m==='RETIRADA'?'block':'none';
};

async function loadLoja(){
  try{const s=await getDocs(collection(db,"produtos"));if(!s.empty){produtos=s.docs.map(d=>({id:d.id,...d.data()}));}}catch(e){}
  const buscaLoja=(document.getElementById("buscaLoja")?.value||"").toLowerCase();
  let lista=produtos;if(buscaLoja)lista=lista.filter(p=>(p.nome+p.codigo).toLowerCase().includes(buscaLoja));if(cat!=='todos')lista=lista.filter(p=>p.nome.toLowerCase().includes(cat));
  document.getElementById("produtos").innerHTML=lista.map(p=>{
    const est=Number(p.estoque??0);
    const tag=est<=0?`<span class="estoqueTag" style="background:#ffe0e0;color:#a00">🔴 ESGOTADO</span>`:est<=3?`<span class="estoqueTag" style="background:#ffefcc;color:#b36a00">⚠️ ${est} BAIXO</span>`: `<span class="estoqueTag" style="background:#e6f7e6;color:#0a7">✅ ${est} estoque</span>`;
    return `<div class="card"><img src="${p.imagem}" onerror="this.src='https://i.imgur.com/Y7VJv3c.jpeg'"><div class="card-body"><div style="font-size:11px;color:#ff8fab;font-weight:800">CÓD: ${p.codigo}</div><div style="font-size:13px;font-weight:700">${p.nome}</div><div class="price">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</div>${tag}<button class="btnAdd" onclick="add('${p.codigo}')" ${est<=0?'disabled':''}>${est<=0?'ESGOTADO':'🛒 ADICIONAR'}</button></div></div>`;
  }).join("")||`<div style="grid-column:1/3;text-align:center;padding:30px;color:#cc8a9c">Nenhum produto</div>`;
}
window.add=(c)=>{const p=produtos.find(x=>x.codigo===c);if(!p||Number(p.estoque)<=0){alert("Esgotado");return}carrinho.push(p);update();abrirCarrinho();};
window.abrirCarrinho=()=>document.getElementById("cart").classList.add("show");
window.fecharCarrinho=()=>document.getElementById("cart").classList.remove("show");
function update(){
  if(carrinho.length===0){
    document.getElementById("cartItems").innerHTML=`<div style="text-align:center;padding:20px;color:#cc8a9c">🛒 Seu carrinho está vazio</div>`;
    document.getElementById("total").innerText="Total: R$ 0,00";
    document.getElementById("cartCount").innerText=0;return;
  }
  const agrupado={};
  carrinho.forEach(p=>{if(!agrupado[p.codigo]) agrupado[p.codigo]={...p,qtd:0}; agrupado[p.codigo].qtd++;});
  let total=0;
  const html=Object.values(agrupado).map(item=>{
    const sub=Number(item.preco)*item.qtd;total+=sub;
    return `<div class="cartItem">
      <img src="${item.imagem}" onerror="this.src='https://i.imgur.com/Y7VJv3c.jpeg'">
      <div class="cartInfo">
        <b>${item.codigo} ${item.nome}</b>
        <small>💲 R$ ${Number(item.preco).toFixed(2).replace('.',',')} cada</small>
        <div class="cartQty">
          <button class="qtyBtn" onclick="alterarQtd('${item.codigo}',-1)">−</button>
          <span class="qtyNum">${item.qtd}x</span>
          <button class="qtyBtn" onclick="alterarQtd('${item.codigo}',1)">+</button>
          <span style="margin-left:8px;font-weight:800">R$ ${sub.toFixed(2).replace('.',',')}</span>
        </div>
      </div>
      <button class="btnRemove" onclick="removerItem('${item.codigo}')">remover</button>
    </div>`;
  }).join("");
  document.getElementById("cartItems").innerHTML=html;
  document.getElementById("total").innerText=`Total: R$ ${total.toFixed(2).replace('.',',')} (${carrinho.length} ${carrinho.length===1?'item':'itens'})`;
  document.getElementById("cartCount").innerText=carrinho.length;
}
window.alterarQtd=(codigo,delta)=>{if(delta===1){const p=produtos.find(x=>x.codigo===codigo);if(p) carrinho.push(p);}else{const idx=carrinho.findIndex(x=>x.codigo===codigo);if(idx>=0) carrinho.splice(idx,1);}update();};
window.removerItem=(codigo)=>{carrinho=carrinho.filter(x=>x.codigo!==codigo);update();};

window.finalizar=async()=>{
  const nome=document.getElementById("nome").value.trim(),whats=document.getElementById("whats").value.trim(),rua=document.getElementById("rua").value.trim(),bairro=document.getElementById("bairro").value.trim(),numero=document.getElementById("numero").value.trim(),referencia=document.getElementById("referencia").value.trim(),pagamento=document.getElementById("pagamento").value;
  if(!nome||!whats){alert("Preencha nome e WhatsApp");return}
  if(modoEntrega==='ENTREGA' && (!rua||!bairro||!numero)){alert("Para ENTREGA preencha Rua, Bairro e Número");return}
  if(carrinho.length===0){alert("Carrinho vazio");return}
  const dataHora=new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}),total=carrinho.reduce((s,p)=>s+Number(p.preco),0);
  let enderecoCompleto="",enderecoWhats="";
  if(modoEntrega==='RETIRADA'){
    enderecoCompleto="📦 PRONTO A RETIRADA NA LOJA";
    enderecoWhats="📦 *Modo:* PRONTO A RETIRADA NA LOJA 🏪";
  }else{
    enderecoCompleto=`${rua}, Nº ${numero}, ${bairro}, Ref: ${referencia}`;
    enderecoWhats=`🏠 *Modo:* ENTREGA\n🛣️ *Rua:* ${rua}\n🏘️ *Bairro:* ${bairro}\n🔢 *Número:* ${numero}\n📍 *Referência:* ${referencia||'Não informada'}`;
  }
  try{
    const cli=await addDoc(collection(db,"clientes"),{nome,whatsapp:whats,rua,bairro,numero,referencia,endereco:enderecoCompleto,modoEntrega,pagamento,dataHora,criadoEm:serverTimestamp()});
    await addDoc(collection(db,"pedidos"),{clienteId:cli.id,clienteNome:nome,clienteWhats:whats,rua,bairro,numero,referencia,endereco:enderecoCompleto,modoEntrega,pagamento,produtos:carrinho.map(c=>({codigo:c.codigo,nome:c.nome,preco:c.preco,imagem:c.imagem})),total,status:"EM ANDAMENTO",dataHora,criadoEm:serverTimestamp()});
    for(const c of carrinho){const prod=produtos.find(p=>p.codigo===c.codigo);if(prod&&prod.id){await updateDoc(doc(db,"produtos",prod.id),{estoque:Math.max(0,Number(prod.estoque||0)-1)});}}
  }catch(e){}
  const agrupado={};carrinho.forEach(p=>{if(!agrupado[p.codigo]) agrupado[p.codigo]={...p,qtd:0}; agrupado[p.codigo].qtd++;});
  const lista=Object.values(agrupado).map(c=>`• 🔹 *CÓD: ${c.codigo}* - ${c.nome}\n   ${c.qtd}x R$ ${Number(c.preco).toFixed(2).replace('.',',')} = R$ ${(c.qtd*Number(c.preco)).toFixed(2).replace('.',',')}`).join("\n\n");
  const msg=`🩴 *NOVO PEDIDO - CIDOKA CHINELOS* 🩴\n\n👤 *Cliente:* ${nome}\n📱 *Whats:* ${whats}\n${enderecoWhats}\n💳 *Pag:* ${pagamento}\n📅 *Data:* ${dataHora}\n\n📦 *PRODUTOS:*\n${lista}\n\n💰 *Total: R$ ${total.toFixed(2).replace('.',',')}*\n⏳ *Status: EM ANDAMENTO*`;
  window.open(`https://wa.me/${MEU_ZAP}?text=${encodeURIComponent(msg)}`,"_blank");carrinho=[];update();fecharCarrinho();loadLoja();loadAdmin();
};
window.check=()=>{const v=document.getElementById("x1").value.trim();if(v===_k||v==="cida304050"){localStorage.setItem("_a","1");document.getElementById("lock").classList.remove("show");document.getElementById("adminArea").style.display="block";document.getElementById("loja").style.display="none";setAba('clientes');loadAdmin();}else alert("Senha incorreta - cida304050");};
window.onFile=(input,isEdit=false,editId=null)=>{const file=input.files[0];if(!file)return;if(file.size>900000){alert("Imagem até 900KB");return}const r=new FileReader();r.onload=e=>{if(isEdit&&editId){galeriaEdit[editId]=e.target.result;const img=document.getElementById("previewEdit-"+editId);if(img){img.src=galeriaEdit[editId];img.style.display="block";}}else{imagemBase64=e.target.result;const img=document.getElementById("preview");if(img){img.src=imagemBase64;img.style.display="block";}}};r.readAsDataURL(file);};

window.loadAdmin=async()=>{
  const busca=(document.getElementById("busca").value||"").toLowerCase();
  try{
    for(const k of ["pedidos","clientes","produtos","abandonados","encomendas"]){try{const s=await getDocs(collection(db,k));todos[k]=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){todos[k]=[];}}
    const pedidos=todos.pedidos,clientes=todos.clientes,produtosAdm=todos.produtos.length?todos.produtos:produtos,abandonados=todos.abandonados,encomendas=todos.encomendas;
    const fat=pedidos.reduce((s,p)=>s+Number(p.total||0),0);const baixo=produtosAdm.filter(p=>Number(p.estoque||0)<=3).length;const fatAband=abandonados.reduce((s,p)=>s+Number(p.total||0),0);
    document.getElementById("dash").innerHTML=`<div class="dashCard"><b>R$ ${fat.toFixed(2).replace('.',',')}</b><span>💰 Faturamento</span></div><div class="dashCard"><b>${pedidos.length}</b><span>📦 Pedidos</span></div><div class="dashCard"><b>${abandonados.length}</b><span>🤖 Abandon.<br><small>R$ ${fatAband.toFixed(0)}</small></span></div><div class="dashCard"><b style="color:${baixo>0?'#e11':'#0a7'}">${baixo}</b><span>⚠️ Baixo estoque</span></div><div class="dashCard" style="grid-column:1/3"><b style="color:${encomendas.length>0?'#ff8fab':'#111'}">${encomendas.length}</b><span>📝 Encomendas</span></div>`;
    let itens=todos[aba]||[];if(aba==='produtos'&&itens.length===0)itens=produtos;if(aba==='ia')itens=produtosAdm;if(busca&&aba!=='ia')itens=itens.filter(i=>JSON.stringify(i).toLowerCase().includes(busca));
    const form=document.getElementById("formAdd"),list=document.getElementById("adminList");
    if(aba==='clientes'){
      form.innerHTML=`<h3>👥 ${clientes.length} Clientes - Cadastro Completo</h3>`;
      list.innerHTML=clientes.map(c=>`<div class="editCard" style="border-left:6px solid ${c.modoEntrega==='RETIRADA'?'#ff8fab':'#25D366'}"><b>${c.nome}</b> - ${c.whatsapp} <span style="float:right">${c.modoEntrega==='RETIRADA'?'📦 RETIRADA':'🏠 ENTREGA'}</span><br><small>🛣️ ${c.rua||''} ${c.numero||''} | 🏘️ ${c.bairro||''}<br>📍 ${c.referencia||c.endereco||''} | ${c.dataHora||''}</small><br><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-ok" onclick="window.open('https://wa.me/55${(c.whatsapp||'').replace(/\\D/g,'')}')">💬 Zap</button><button class="btn btn-del" onclick="delDoc('clientes','${c.id}')">🗑️</button></div></div>`).join("")||`Nenhum cliente`;
    }
    else if(aba==='encomendas'){
      form.innerHTML=`<h3>📝 Cadastrar Cliente para Encomenda - Completo</h3><div style="display:flex;gap:8px"><input id="encNome" class="input" placeholder="👤 Nome *"><input id="encZap" class="input" placeholder="📱 Whats *"></div><div style="display:flex;gap:8px"><input id="encRua" class="input" placeholder="🛣️ Rua"><input id="encBairro" class="input" placeholder="🏘️ Bairro"></div><div style="display:flex;gap:8px"><input id="encNumero" class="input" placeholder="🔢 Nº"><input id="encRef" class="input" placeholder="📍 Referência"></div><div style="display:flex;gap:8px"><select id="encModo" class="input"><option value="ENTREGA">🏠 Entrega</option><option value="RETIRADA">📦 Retirada</option></select><input id="encProduto" class="input" placeholder="📦 CÓD A1 *"></div><div style="display:flex;gap:8px"><input id="encTamanho" class="input" placeholder="Tam 37"><input id="encQtd" class="input" type="number" placeholder="Qtd" value="1"><input id="encData" class="input" type="date"></div><div style="display:flex;gap:8px"><input id="encSinal" class="input" type="number" step="0.01" placeholder="Sinal R$"><input id="encTotal" class="input" type="number" step="0.01" placeholder="Total R$"></div><input id="encObs" class="input" placeholder="📝 Obs"><select id="encStatus" class="input"><option value="PENDENTE">🟡 PENDENTE</option><option value="PRODUZINDO">🟠 PRODUZINDO</option><option value="PRONTO">🟢 PRONTO</option><option value="ENTREGUE">✅ ENTREGUE</option></select><button class="btn btn-encomenda" onclick="addEncomenda()">💾 SALVAR ENCOMENDA</button>`;
      list.innerHTML=itens.sort((a,b)=>(b.criadoEm?.seconds||0)-(a.criadoEm?.seconds||0)).map(e=>{const corStatus=e.status==='PENDENTE'?'#ffcc00':e.status==='PRODUZINDO'?'#ff8f00':e.status==='PRONTO'?'#25D366':'#888';const falta=Number(e.total||0)-Number(e.sinal||0);return `<div class="editCard" style="border-left:6px solid ${corStatus}"><b>${e.nome}</b> - ${e.whatsapp} <span style="float:right;font-weight:800;color:${corStatus}">${e.status}</span><br><small>${e.modoEntrega==='RETIRADA'?'📦 RETIRADA':'🏠 ENTREGA'} | 📦 ${e.produtoCodigo} Tam ${e.tamanho||'-'} Qtd ${e.qtd||1} | Falta R$${falta.toFixed(2)}</small><br><small>🛣️ ${e.rua||''} ${e.numero||''} | 🏘️ ${e.bairro||''}<br>📍 ${e.referencia||''} | 📅 ${e.dataEntrega||'-'}</small><br><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn btn-ok" onclick="mudarStatusEnc('${e.id}','PRONTO')">✅ Pronto</button><button class="btn btn-edit" onclick="mudarStatusEnc('${e.id}','ENTREGUE')">📦 Entregue</button><button class="btn btn-edit" style="background:#ff8fab" onclick="chamarEnc('${e.id}')">💬 Zap</button><button class="btn btn-del" onclick="delDoc('encomendas','${e.id}')">🗑️</button></div></div>`;}).join("")||"Nenhuma encomenda";
    }
    else if(aba==='produtos'){
      form.innerHTML=`<h3>➕ Novo Produto - Catálogo</h3><div style="display:flex;gap:8px"><input id="pCod" class="input" placeholder="Código A2"><input id="pEst" class="input" type="number" placeholder="Estoque 20"></div><input id="pNome" class="input" placeholder="Nome ex: Chinelo Floral Rosa"><input id="pPreco" class="input" type="number" step="0.01" placeholder="Preço 59.90"><input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFile(this,false)"><button class="btn btn-galeria" onclick="document.getElementById('fileInput').click()">📷 ESCOLHER DA GALERIA</button><img id="preview" class="previewImg"><input id="pImg" class="input" placeholder="Ou ./chinelo_A2.jpg"><button class="btn btn-ok" style="width:100%;padding:14px" onclick="addProd()">💾 SALVAR NO CATÁLOGO</button>`;
      list.innerHTML=itens.map(p=>{
        const ident=p.id||p.codigo;
        return `<div class="editCard" id="card-${ident}"><div style="display:flex;gap:10px"><img src="${p.imagem}" style="width:70px;height:70px;border-radius:12px;object-fit:cover" onerror="this.src='https://i.imgur.com/Y7VJv3c.jpeg'"><div style="flex:1"><b>${p.nome}</b><br><small>CÓD: ${p.codigo} | R$ ${Number(p.preco).toFixed(2).replace('.',',')} | ${p.estoque} unid.</small></div></div>
        <div id="edit-${ident}" style="display:none;margin-top:10px"><div style="display:flex;gap:8px"><input id="e-cod-${ident}" value="${p.codigo}" class="input"><input id="e-est-${ident}" type="number" value="${p.estoque}" class="input"></div><input id="e-nome-${ident}" value="${p.nome}" class="input"><input id="e-preco-${ident}" type="number" step="0.01" value="${p.preco}" class="input"><input type="file" id="fileEdit-${ident}" accept="image/*" style="display:none" onchange="onFile(this,true,'${ident}')"><button class="btn btn-galeria" style="padding:10px;margin-top:6px" onclick="document.getElementById('fileEdit-${ident}').click()">📷 TROCAR FOTO DA GALERIA</button><img id="previewEdit-${ident}" class="previewImg"><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-ok" style="flex:1" onclick="salvarEdicao('${ident}')">💾 SALVAR ALTERAÇÕES</button><button class="btn btn-del" onclick="toggleEdit('${ident}')">✕</button></div></div>
        <div style="display:flex;gap:8px;margin-top:10px" id="btns-${ident}">
          <button class="btn btn-edit" style="flex:2" onclick="toggleEdit('${ident}')">✏️ EDITAR TUDO</button>
          <button class="btn btn-del" style="flex:1;background:#ffe0e0;color:#c00;font-weight:800;border:2px solid #ff8fab" onclick="removerProduto('${ident}')">🗑️ REMOVER</button>
        </div></div>`;
      }).join("")||"Nenhum produto";
    }
    else if(aba==='ia'){
      form.innerHTML=`<h3>🧠 IA 6 - Previsão de Estoque (só admin vê)</h3>`;
      list.innerHTML=produtosAdm.map(p=>{const vendidos=pedidos.reduce((s,ped)=>s+ (ped.produtos||[]).filter(pr=>pr.codigo===p.codigo).length,0);const mediaDia=vendidos/30||0.1;const diasRestantes=mediaDia>0?Math.floor(Number(p.estoque)/mediaDia):99;const cor=diasRestantes<=3?'#e11':diasRestantes<=7?'#b36a00':'#0a7';const texto=diasRestantes<=3?`🔴 ACABA EM ${diasRestantes} DIAS - COMPRAR AGORA!`:diasRestantes<=7?`🟡 Acaba em ${diasRestantes} dias`:`🟢 Tranquilo - ${diasRestantes} dias`;return `<div class="editCard" style="border-left:6px solid ${cor}"><b>${p.codigo} - ${p.nome}</b><br><small>Estoque: ${p.estoque} | Vendidos/mês: ${vendidos}</small><br><div class="alertIA" style="border-color:${cor};margin-top:6px"><b style="color:${cor}">${texto}</b><br>IA sugere: comprar ${Math.ceil(mediaDia*15)} unid.</div></div>`;}).join("");
    }
    else if(aba==='abandonados'){
      form.innerHTML=`<h3>🤖 IA 7 - Carrinhos Abandonados (só admin)</h3>`;
      list.innerHTML=itens.sort((a,b)=>(b.criadoEm?.seconds||0)-(a.criadoEm?.seconds||0)).map(a=>`<div class="editCard" style="border-left:6px solid #ff8fab"><b>🛒 R$ ${Number(a.total||0).toFixed(2)}</b> - ${a.dataHora||''}<br><small>${(a.produtos||[]).map(p=>p.codigo).join(', ')}</small><br><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-ok" onclick="recuperarAbandonado('${a.id}')">💬 RECUPERAR NO ZAP</button><button class="btn btn-del" onclick="delDoc('abandonados','${a.id}')">🗑️</button></div></div>`).join("")||"Nenhum abandono";
    }
    else{
      form.innerHTML=`<h3>📦 ${itens.length} Pedidos - Completo</h3>`;
      list.innerHTML=itens.sort((a,b)=>(b.criadoEm?.seconds||0)-(a.criadoEm?.seconds||0)).map(p=>`<div class="editCard" style="border-left:6px solid ${p.status==='PRODUTO PRONTO'?'#25D366':'#ffcc00'}"><b>${p.clienteNome}</b> - ${p.clienteWhats} <span style="float:right">${p.modoEntrega==='RETIRADA'?'📦 RETIRADA':'🏠 ENTREGA'}</span><br><small>R$${Number(p.total||0).toFixed(2)} | ${p.dataHora||''}<br>${p.modoEntrega==='RETIRADA'?'📦 Retirada na loja':`🛣️ ${p.rua||''} ${p.numero||''} | 🏘️ ${p.bairro||''}<br>📍 ${p.referencia||''}`} | ${p.status}</small><br><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-ok" onclick="mudaStatus('${p.id}')">✅ PRONTO</button><button class="btn btn-del" onclick="delDoc('pedidos','${p.id}')">🗑️</button></div></div>`).join("")||"Nenhum pedido";
    }
  }catch(e){document.getElementById("adminList").innerHTML="Erro: "+e.message;}
};
window.removerProduto=async(ident)=>{
  if(!confirm(`🗑️ Remover produto ${ident} do catálogo?`)) return;
  try{
    const prod=produtos.find(p=>p.id===ident || p.codigo===ident);
    if(prod && prod.id){await deleteDoc(doc(db,"produtos",prod.id));}
    else{const idx=produtos.findIndex(p=>p.codigo===ident);if(idx>=0) produtos.splice(idx,1);}
    alert("✅ Removido!");loadAdmin();loadLoja();
  }catch(e){alert("Erro: "+e.message);}
};
window.addEncomenda=async()=>{
  const nome=document.getElementById('encNome').value.trim(),whatsapp=document.getElementById('encZap').value.trim(),rua=document.getElementById('encRua').value.trim(),bairro=document.getElementById('encBairro').value.trim(),numero=document.getElementById('encNumero').value.trim(),referencia=document.getElementById('encRef').value.trim(),modoEntrega=document.getElementById('encModo').value,produtoCodigo=document.getElementById('encProduto').value.trim(),tamanho=document.getElementById('encTamanho').value.trim(),qtd=parseInt(document.getElementById('encQtd').value)||1,dataEntrega=document.getElementById('encData').value,sinal=parseFloat(document.getElementById('encSinal').value)||0,total=parseFloat(document.getElementById('encTotal').value)||0,obs=document.getElementById('encObs').value.trim(),status=document.getElementById('encStatus').value;
  if(!nome||!whatsapp||!produtoCodigo){alert("Nome, Whats e CÓD obrigatórios");return;}
  const endereco=modoEntrega==='RETIRADA'?'📦 RETIRADA NA LOJA':`${rua}, ${numero}, ${bairro}, ${referencia}`;
  try{
    await addDoc(collection(db,"encomendas"),{nome,whatsapp,rua,bairro,numero,referencia,endereco,modoEntrega,produtoCodigo,tamanho,qtd,dataEntrega,sinal,total,obs,status,dataHora:new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}),criadoEm:serverTimestamp(),clienteWhats:whatsapp});
    await addDoc(collection(db,"clientes"),{nome,whatsapp,rua,bairro,numero,referencia,endereco,modoEntrega,dataHora:new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}),criadoEm:serverTimestamp()});
    alert("✅ Encomenda cadastrada!");loadAdmin();
  }catch(e){alert("Erro: "+e.message);}
};
window.mudarStatusEnc=async(id,status)=>{await updateDoc(doc(db,"encomendas",id),{status});loadAdmin();};
window.chamarEnc=(id)=>{const e=todos.encomendas.find(x=>x.id===id);if(!e)return;const falta=Number(e.total||0)-Number(e.sinal||0);let endTxt=e.modoEntrega==='RETIRADA'?'📦 PRONTO A RETIRADA':`🛣️ ${e.rua} ${e.numero}\n🏘️ ${e.bairro}\n📍 ${e.referencia}`;const msg=`Oi ${e.nome}! 🌸 Sua encomenda CIDOKA:\n\n📦 ${e.produtoCodigo} Tam ${e.tamanho||'-'} Qtd ${e.qtd}\n${endTxt}\n📅 Entrega: ${e.dataEntrega||'a combinar'}\n💰 Total R$${Number(e.total||0).toFixed(2)} | Falta R$${falta.toFixed(2)}\n📍 Status: ${e.status}`;window.open(`https://wa.me/55${(e.whatsapp||'').replace(/\\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');};
window.recuperarAbandonado=(id)=>{const a=todos.abandonados.find(x=>x.id===id);if(!a)return;const lista=(a.produtos||[]).map(p=>`• ${p.codigo} - ${p.nome}`).join('\n');const msg=`Oi! 🌸 Vi que você gostou desses na CIDOKA mas não finalizou:\n\n${lista}\n\n💰 Total: R$ ${Number(a.total).toFixed(2)}`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');};
window.toggleEdit=(id)=>{const el=document.getElementById("edit-"+id),btns=document.getElementById("btns-"+id),card=document.getElementById("card-"+id);if(!el)return;if(el.style.display==="none"){el.style.display="block";if(btns)btns.style.display="none";if(card)card.classList.add("editando");}else{el.style.display="none";if(btns)btns.style.display="flex";if(card)card.classList.remove("editando");}};
window.salvarEdicao=async(id)=>{const codigo=document.getElementById("e-cod-"+id)?.value.trim(),nome=document.getElementById("e-nome-"+id)?.value.trim(),preco=parseFloat(document.getElementById("e-preco-"+id)?.value),estoque=parseInt(document.getElementById("e-est-"+id)?.value);if(!codigo||!nome||isNaN(preco)){alert("Preencha tudo");return;}const prod=produtos.find(p=>p.id===id||p.codigo===id);if(prod&&!prod.id){prod.codigo=codigo;prod.nome=nome;prod.preco=preco;prod.estoque=estoque;if(galeriaEdit[id])prod.imagem=galeriaEdit[id];loadLoja();loadAdmin();alert("✅ Atualizado!");return;}const up={codigo,nome,preco,estoque};if(galeriaEdit[id])up.imagem=galeriaEdit[id];await updateDoc(doc(db,"produtos",id),up);delete galeriaEdit[id];alert("✅ Salvo!");loadAdmin();loadLoja();};
window.addProd=async()=>{const codigo=document.getElementById("pCod").value.trim(),nome=document.getElementById("pNome").value.trim(),preco=parseFloat(document.getElementById("pPreco").value),estoque=parseInt(document.getElementById("pEst").value)||0;let imagem=document.getElementById("pImg").value.trim()||imagemBase64||"./chinelo_A1.jpg";if(imagemBase64)imagem=imagemBase64;if(!codigo||!nome||isNaN(preco)){alert("Código, nome e preço");return}await addDoc(collection(db,"produtos"),{codigo,nome,preco,estoque,imagem,criadoEm:serverTimestamp()});imagemBase64="";alert("✅ Salvo!");loadAdmin();loadLoja();};
window.delDoc=async(col,id)=>{if(!confirm("Excluir?"))return;await deleteDoc(doc(db,col,id));loadAdmin();if(col==='produtos')loadLoja();};
window.mudaStatus=async(id)=>{await updateDoc(doc(db,"pedidos",id),{status:"PRODUTO PRONTO",statusFinal:"PRODUTO PRONTO"});loadAdmin();};

loadLoja();
document.getElementById("loja").style.display="block";
document.getElementById("adminArea").style.display="none";
</script>
