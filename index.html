<div id="cart" onclick="if(event.target.id==='cart')fecharCarrinho()"><div id="cartBox"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3>🛒 Seu Pedido - Prévia com Foto e Tamanho</h3><span style="font-size:26px;cursor:pointer" onclick="fecharCarrinho()">✕</span></div><div id="cartItems"></div><div class="totalBox" id="total">Total: R$ 0,00</div><div class="modoBox"><button id="btnEntrega" class="modoBtn on" onclick="setModo('ENTREGA')">🏠 Entrega</button><button id="btnRetirada" class="modoBtn" onclick="setModo('RETIRADA')">📦 Pronto a Retirada</button></div><input id="nome" class="input" placeholder="👤 Seu nome *"><input id="whats" class="input" placeholder="📱 WhatsApp *"><div id="camposEndereco"><input id="rua" class="input" placeholder="🛣️ Rua *"><div style="display:flex;gap:8px"><input id="bairro" class="input" placeholder="🏘️ Bairro *"><input id="numero" class="input" placeholder="🔢 Nº *" style="max-width:100px"></div><input id="referencia" class="input" placeholder="📍 Ponto de referência"></div><div id="avisoRetirada" style="display:none;background:#fff0f5;padding:10px;border-radius:10px;text-align:center;border:2px dashed #ff8fab;margin:6px 0">📦 <b>Pronto a Retirada na loja</b></div><select id="pagamento" class="input"><option>💳 Pix</option><option>💵 Dinheiro</option><option>💳 Cartão na entrega</option></select><button class="btnzap" onclick="finalizar()">FINALIZAR NO WHATSAPP ✅</button></div></div>
<script type="module">

      list.innerHTML=itens.map(p=>{const ident=p.id||p.codigo;const jaNoFirebase=!!p.id;const isChinelo=p.tipo==='chinelo'||p.codigo.startsWith('A');return `<div class="editCard" style="border-left:4px solid ${jaNoFirebase?'#25D366':'#ffcc00'}"><div style="display:flex;gap:10px"><img src="${p.imagem}" style="width:70px;height:70px;border-radius:12px;object-fit:cover;cursor:zoom-in" onclick="abrirPreview('${p.codigo}')" onerror="this.src='https://i.imgur.com/Y7VJv3c.jpeg'"><div style="flex:1"><b>${p.nome}</b> <small style="background:${isChinelo?'#111':'#ff8fab'};color:#fff;padding:2px 6px;border-radius:10px;font-size:10px">${p.codigo} - ${p.tipo? p.tipo.toUpperCase() : (isChinelo?'CHINELO':'SABONETE')} ${p.tamanhos && p.tamanhos.length?`• 👟 ${p.tamanhos.join(', ')}`:''}</small><br><small>R$ ${Number(p.preco).toFixed(2)} | ${p.estoque} unid.</small><br><small style="color:${jaNoFirebase?'#0a7':'#b36a00'}">${jaNoFirebase?'✅ Salvo na nuvem - todos veem':'⚠️ Só local - clique no botão verde acima'}</small></div></div><div id="edit-${ident}" style="display:none;margin-top:10px"><div style="display:flex;gap:8px"><input id="e-cod-${ident}" value="${p.codigo}" class="input"><input id="e-est-${ident}" type="number" value="${p.estoque}" class="input"></div><input id="e-nome-${ident}" value="${p.nome}" class="input"><input id="e-preco-${ident}" type="number" step="0.01" value="${p.preco}" class="input"><input type="file" id="fileEdit-${ident}" accept="image/*" style="display:none" onchange="onFile(this,true,'${ident}')"><button class="btn btn-galeria" style="padding:10px;margin-top:6px" onclick="document.getElementById('fileEdit-${ident}').click()">📷 TROCAR FOTO</button><img id="previewEdit-${ident}" class="previewImg"><div style="display:flex;gap:6px;margin-top:8px"><button class="btn btn-ok" style="flex:1" onclick="salvarEdicao('${ident}')">💾 SALVAR</button><button class="btn btn-del" onclick="toggleEdit('${ident}')">✕</button></div></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-edit" style="flex:1" onclick="toggleEdit('${ident}')">✏️ EDITAR</button><button class="btn btn-edit" style="flex:1;background:#ff8fab" onclick="abrirPreview('${p.codigo}')">🔍 PRÉVIA</button><button class="btn btn-del" style="flex:1;background:#ffe0e0;color:#c00;font-weight:800;border:2px solid #ff8fab" onclick="removerProduto('${ident}')">🗑️ REMOVER</button></div></div>`;}).join("")||"Nenhum produto";
    }
    else if(aba==='ia'){
      form.innerHTML=`<h3>🧠 IA - Tamanho mais pedido</h3>`;
      list.innerHTML=produtosAdm.map(p=>{const vendidos=pedidos.reduce((s,ped)=>s+ (ped.produtos||[]).filter(pr=>pr.codigo===p.codigo).length,0);const tamMaisVendido={};pedidos.forEach(ped=>{(ped.produtos||[]).filter(pr=>pr.codigo===p.codigo&&pr.tamanho).forEach(pr=>{tamMaisVendido[pr.tamanho]=(tamMaisVendido[pr.tamanho]||0)+1})});const topTam=Object.entries(tamMaisVendido).sort((a,b)=>b[1]-a[1])[0];return `<div class="editCard"><b>${p.codigo} - ${p.nome}</b><br><small>Estoque: ${p.estoque} | Vendidos: ${vendidos} ${topTam?`• Tam mais pedido: ${topTam[0]} (${topTam[1]}x)`:''}</small></div>`;}).join("");
    }
    else if(aba==='abandonados'){
      form.innerHTML=`<h3>🤖 Carrinhos Abandonados</h3>`;
      list.innerHTML=itens.map(a=>`<div class="editCard"><b>🛒 R$ ${Number(a.total||0).toFixed(2)}</b> - ${a.dataHora||''}<br><small>${(a.produtos||[]).map(p=>`${p.codigo} ${p.tamanho||''}`).join(', ')}</small><br><button class="btn btn-ok" onclick="recuperarAbandonado('${a.id}')">💬 RECUPERAR</button><button class="btn btn-del" onclick="delDoc('abandonados','${a.id}')">🗑️</button></div>`).join("")||"Nenhum abandonado";
    }
  }catch(e){document.getElementById("adminList").innerHTML="Erro: "+e.message;}
};
window.addEncomenda=async()=>{
  const nome=document.getElementById('encNome').value.trim(),whatsapp=document.getElementById('encZap').value.trim(),rua=document.getElementById('encRua').value.trim(),bairro=document.getElementById('encBairro').value.trim(),numero=document.getElementById('encNumero').value.trim(),referencia=document.getElementById('encRef').value.trim(),modoEntrega=document.getElementById('encModo').value,produtoCodigo=document.getElementById('encProduto').value.trim(),tamanho=document.getElementById('encTamanho').value,qtd=parseInt(document.getElementById('encQtd').value)||1,dataEntrega=document.getElementById('encData').value,sinal=parseFloat(document.getElementById('encSinal').value)||0,total=parseFloat(document.getElementById('encTotal').value)||0,obs=document.getElementById('encObs').value.trim(),status=document.getElementById('encStatus').value;
  if(!nome||!whatsapp||!produtoCodigo){alert("Nome, Whats e CÓD obrigatórios");return;}
  const endereco=modoEntrega==='RETIRADA'?'📦 RETIRADA NA LOJA':`${rua}, ${numero}, ${bairro}, ${referencia}`;
  try{await addDoc(collection(db,"encomendas"),{nome,whatsapp,rua,bairro,numero,referencia,endereco,modoEntrega,produtoCodigo,tamanho,qtd,dataEntrega,sinal,total,obs,status,dataHora:new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}),criadoEm:serverTimestamp(),clienteWhats:whatsapp});await addDoc(collection(db,"clientes"),{nome,whatsapp,rua,bairro,numero,referencia,endereco,modoEntrega,dataHora:new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"}),criadoEm:serverTimestamp()});alert("✅ Encomenda com tamanho cadastrada!");loadAdmin();}catch(e){alert("Erro: "+e.message);}};
window.mudarStatusEnc=async(id,status)=>{await updateDoc(doc(db,"encomendas",id),{status});loadAdmin();};
window.chamarEnc=(id)=>{const e=todos.encomendas.find(x=>x.id===id);if(!e)return;const falta=Number(e.total||0)-Number(e.sinal||0);let endTxt=e.modoEntrega==='RETIRADA'?'📦 RETIRADA':`🛣️ ${e.rua} ${e.numero} 🏘️ ${e.bairro} 📍 ${e.referencia}`;const msg=`Oi ${e.nome}! 🌸 Encomenda ${e.produtoCodigo} Tam ${e.tamanho||''} - ${endTxt} - Falta R$${falta.toFixed(2)} - ${e.status}`;window.open(`https://wa.me/55${(e.whatsapp||'').replace(/\\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');};
window.recuperarAbandonado=(id)=>{const a=todos.abandonados.find(x=>x.id===id);if(!a)return;const lista=(a.produtos||[]).map(p=>`${p.codigo} ${p.tamanho||''}`).join('\n');window.open(`https://wa.me/?text=${encodeURIComponent(lista)}`,'_blank');};
window.toggleEdit=(id)=>{const el=document.getElementById("edit-"+id);if(el)el.style.display=el.style.display==="none"?"block":"none";};
window.salvarEdicao=async(id)=>{const codigo=document.getElementById("e-cod-"+id)?.value.trim(),nome=document.getElementById("e-nome-"+id)?.value.trim(),preco=parseFloat(document.getElementById("e-preco-"+id)?.value),estoque=parseInt(document.getElementById("e-est-"+id)?.value);if(!codigo||!nome||isNaN(preco)){alert("Preencha tudo");return;}const up={codigo,nome,preco,estoque};if(galeriaEdit[id])up.imagem=galeriaEdit[id];await updateDoc(doc(db,"produtos",id),up);delete galeriaEdit[id];alert("✅ Salvo!");loadAdmin();loadLoja();};
window.addProd=async()=>{
  const codigo=document.getElementById("pCod").value.trim(),nome=document.getElementById("pNome").value.trim(),preco=parseFloat(document.getElementById("pPreco").value),estoque=parseInt(document.getElementById("pEst").value)||0;
  let imagem=document.getElementById("pImg")?.value.trim()||imagemBase64||"./chinelo_A1.jpg";if(imagemBase64)imagem=imagemBase64;
  if(!codigo||!nome||isNaN(preco)){alert("Código, nome e preço");return}
  const frag=document.getElementById("pFrag")?.value||"",peso=document.getElementById("pPeso")?.value||"";
  const dados={codigo,nome,preco,estoque,imagem,tipo:tipoNovo,tamanhos:tipoNovo==='chinelo'?(tamanhosNovo.length?tamanhosNovo:TAMANHOS):[],fragrancia:frag,peso,criadoEm:serverTimestamp()};
  await addDoc(collection(db,"produtos"),dados);
  imagemBase64="";tamanhosNovo=[];
  alert(`✅ ${tipoNovo.toUpperCase()} ${codigo} salvo! Próximo será ${proximoCodigo(tipoNovo)}`);
  loadAdmin();loadLoja();
};
window.removerProduto=async(ident)=>{if(!confirm(`🗑️ Remover ${ident}?`)) return;try{const prod=produtos.find(p=>p.id===ident || p.codigo===ident);if(prod && prod.id){await deleteDoc(doc(db,"produtos",prod.id));}else{const idx=produtos.findIndex(p=>p.codigo===ident);if(idx>=0) produtos.splice(idx,1);}alert("✅ Removido!");loadAdmin();loadLoja();}catch(e){alert("Erro: "+e.message);}};
window.delDoc=async(col,id)=>{if(!confirm("Excluir?"))return;await deleteDoc(doc(db,col,id));loadAdmin();if(col==='produtos')loadLoja();};
window.alterarStatusPedido=async(id,novoStatus)=>{await updateDoc(doc(db,"pedidos",id),{status:novoStatus});loadAdmin();};
loadLoja();
</script>
